<svg xmlns="http://www.w3.org/2000/svg" width="410" height="214" viewBox="0 0 410 214" role="img" aria-labelledby="title desc"><title id="title">PoroTalk</title><desc id="desc">App desktop. Chat vocal éphémère pour League of Legends : connexion automatique avec tes coéquipiers, en WebRTC P2P, sans lien à partager. Technologies : Electron, TypeScript, WebRTC.</desc><defs><style>@font-face{font-family:'Manrope';font-weight:600;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Cinzel';font-weight:600;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Manrope';font-weight:400;src:url(data:font/woff;base64,) format('woff')}</style><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#170D0D"/><stop offset="1" stop-color="#0C0909"/></linearGradient><radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#670C0C" stop-opacity=".5"/><stop offset="1" stop-color="#670C0C" stop-opacity="0"/></radialGradient><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7E2A0"/><stop offset=".55" stop-color="#D4AF37"/><stop offset="1" stop-color="#A47E22"/></linearGradient><clipPath id="card"><rect width="410" height="214" rx="14"/></clipPath></defs><rect width="410" height="214" rx="14" fill="url(#bg)"/><rect width="410" height="214" rx="14" fill="url(#glow)"/><rect x="24" y="24" width="46" height="46" rx="10" fill="#670C0C" fill-opacity=".35" stroke="#D4AF37" stroke-opacity=".4"/><path transform="translate(35 35)" d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4" fill="none" stroke="#D4AF37" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="299.3" y="24" width="86.7" height="20" rx="10" fill="#D4AF37" fill-opacity="0" stroke="#FFFFFF" stroke-opacity=".18"/><text x="309.326" y="37.42" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="9.5" fill="#9C9086" letter-spacing="1.4">CODE PRIVÉ</text><text x="84" y="40" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="10" fill="#B8994A" letter-spacing="2">APP DESKTOP</text><text x="83" y="67" font-family="'Cinzel', Georgia, serif" font-weight="600" font-size="24" fill="url(#gold)">PoroTalk</text><text x="24" y="104" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="13.5" fill="#E4DACB" fill-opacity="0.88">Chat vocal éphémère pour League of Legends : connexion</text><text x="24" y="124" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="13.5" fill="#E4DACB" fill-opacity="0.88">automatique avec tes coéquipiers, en WebRTC P2P, sans</text><text x="24" y="144" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="13.5" fill="#E4DACB" fill-opacity="0.88">lien à partager.</text><rect x="24" y="168" width="64.5" height="22" rx="11" fill="#D4AF37" fill-opacity=".07" stroke="#D4AF37" stroke-opacity=".35"/><text x="56.2365" y="182.96" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11" fill="#E9DCB0" text-anchor="middle">Electron</text><rect x="94.473" y="168" width="77.8" height="22" rx="11" fill="#D4AF37" fill-opacity=".07" stroke="#D4AF37" stroke-opacity=".35"/><text x="133.348" y="182.96" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11" fill="#E9DCB0" text-anchor="middle">TypeScript</text><rect x="178.223" y="168" width="65.7" height="22" rx="11" fill="#D4AF37" fill-opacity=".07" stroke="#D4AF37" stroke-opacity=".35"/><text x="211.056" y="182.96" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11" fill="#E9DCB0" text-anchor="middle">WebRTC</text><rect x=".5" y=".5" width="409" height="213" rx="13.5" fill="none" stroke="#D4AF37" stroke-opacity=".3"/><path d="M9 25V9H25M385 9H401V25M401 189V205H385M25 205H9V189" fill="none" stroke="#D4AF37" stroke-opacity=".7" stroke-width="1.2"/></svg>