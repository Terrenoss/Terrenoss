<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-labelledby="title desc"><title id="title">Terrenoss</title><desc id="desc">Développeur full-stack et game dev, en France. Apps desktop et web pour les joueurs de League of Legends, et jeux vidéo sous Unity, seul ou en équipe. Stack : C#, .NET, Unity, TypeScript, Next.js, Electron.</desc><defs><style>@font-face{font-family:'Cinzel';font-weight:600;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Manrope';font-weight:600;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Manrope';font-weight:400;src:url(data:font/woff;base64,) format('woff')}</style><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#170D0D"/><stop offset="1" stop-color="#0C0909"/></linearGradient><radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#670C0C" stop-opacity=".5"/><stop offset="1" stop-color="#670C0C" stop-opacity="0"/></radialGradient><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7E2A0"/><stop offset=".55" stop-color="#D4AF37"/><stop offset="1" stop-color="#A47E22"/></linearGradient><clipPath id="card"><rect width="860" height="250" rx="14"/></clipPath><radialGradient id="halo"><stop offset="0" stop-color="#670C0C" stop-opacity=".75"/><stop offset="1" stop-color="#670C0C" stop-opacity="0"/></radialGradient><style>.spin{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation:none}}</style></defs><rect width="860" height="250" rx="14" fill="url(#bg)"/><rect width="860" height="250" rx="14" fill="url(#glow)"/><circle cx="712" cy="125" r="122" fill="url(#halo)"/><circle cx="712" cy="125" r="97" fill="none" stroke="#D4AF37" stroke-opacity=".22"/><circle class="spin" cx="712" cy="125" r="88" fill="none" stroke="#D4AF37" stroke-opacity=".6" stroke-width="5" stroke-dasharray="1.4 6.279"/><path d="M712 57L780 125L712 193L644 125ZM664 77H760V173H664Z" fill="none" stroke="#D4AF37" stroke-opacity=".45" stroke-linejoin="round"/><circle cx="712" cy="125" r="40" fill="#670C0C" fill-opacity=".45" stroke="#D4AF37" stroke-opacity=".6"/><text x="712" y="141" font-family="'Cinzel', Georgia, serif" font-weight="600" font-size="46" fill="url(#gold)" text-anchor="middle">T</text><text x="44" y="64" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11" fill="#B8994A" letter-spacing="2.6">DÉVELOPPEUR FULL-STACK · GAME DEV · FRANCE</text><text x="42" y="122" font-family="'Cinzel', Georgia, serif" font-weight="600" font-size="60" fill="url(#gold)">Terrenoss</text><text x="44" y="156" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="15.5" fill="#E4DACB" fill-opacity="0.9">Apps desktop &amp; web pour les joueurs de League of Legends,</text><text x="44" y="178" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="15.5" fill="#E4DACB" fill-opacity="0.9">et jeux vidéo sous Unity, seul ou en équipe.</text><rect x="44" y="198" width="38.2" height="22" rx="11" fill="#D4AF37" fill-opacity=".07" stroke="#D4AF37" stroke-opacity=".35"/><text x="63.119" y="212.96" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11" fill="#E9DCB0" text-anchor="middle">C#</text><rect x="88.238" y="198" width="43.9" height="22" rx="11" fill="#D4AF37" fill-opacity=".07" stroke="#D4AF37" stroke-opacity=".35"/><text x="110.209" y="212.96" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11" fill="#E9DCB0" text-anchor="middle">.NET</text><rect x="138.18" y="198" width="48.2" height="22" rx="11" fill="#D4AF37" fill-opacity=".07" stroke="#D4AF37" stroke-opacity=".35"/><text x="162.284" y="212.96" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11" fill="#