<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-labelledby="title desc"><title id="title">Activité GitHub</title><desc id="desc">1719 contributions depuis le 7 mars 2020. Série en cours : 15 jours, l&#x27;arc rouge montre la progression vers le record. Plus longue série : 15 jours.</desc><defs><style>@font-face{font-family:'Cinzel';font-weight:900;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Manrope';font-weight:600;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Manrope';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@keyframes spin{to{transform:rotate(360deg)}}.ring{transform-box:view-box;transform-origin:430px 86px;animation:spin 90s linear infinite}@keyframes arc{from{stroke-dasharray:0 100}}.arc{animation:arc 1.8s cubic-bezier(.2,.8,.2,1) .3s backwards}@keyframes flame{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.92,1.12) skewX(3deg)}65%{transform:scale(1.05,.9) skewX(-3deg)}}.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame 1s ease-in-out infinite}@keyframes rise-a{0%{transform:translate(0,0);opacity:0}12%{opacity:.95}100%{transform:translate(26px,-60px);opacity:0}}@keyframes rise-b{0%{transform:translate(0,0);opacity:0}12%{opacity:.95}100%{transform:translate(-30px,-67px);opacity:0}}@keyframes rise-c{0%{transform:translate(0,0);opacity:0}12%{opacity:.95}50%{transform:translate(-14px,-25px)}100%{transform:translate(10px,-50px);opacity:0}}.ember{opacity:0;animation-timing-function:linear;animation-iteration-count:infinite}.a{animation-name:rise-a}.b{animation-name:rise-b}.c{animation-name:rise-c}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121014"/><stop offset="1" stop-color="#08080A"/></linearGradient><radialGradient id="glow" cx="1" cy="0" r=".8"><stop offset="0" stop-color="#D3202C" stop-opacity=".16"/><stop offset="1" stop-color="#D3202C" stop-opacity="0"/></radialGradient><clipPath id="card"><path d="M12 0H848L860 12V188L848 200H12L0 188V12Z"/></clipPath><filter id="spark" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path d="M12 0H848L860 12V188L848 200H12L0 188V12Z" fill="url(#bg)"/><path d="M12 0H848L860 12V188L848 200H12L0 188V12Z" fill="url(#glow)"/><path d="M290 40V164" stroke="#C8AA6E" stroke-opacity=".15"/><path d="M570 40V164" stroke="#C8AA6E" stroke-opacity=".15"/><text x="150" y="106" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="40" fill="#C8AA6E" text-anchor="middle">1 719</text><text x="150" y="160" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="12.5" fill="#E4DDCF" text-anchor="middle">Contributions au total</text><text x="150" y="180" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="11.5" fill="#8F877A" text-anchor="middle">depuis le 7 mars 2020</text><text x="710" y="106" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="40" fill="#C8AA6E" text-anchor="middle">15</text><text x="710" y="160" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="12.5" fill="#E4DDCF" text-anchor="middle">Plus longue série</text><text x="710" y="180" font-family="'Manrope', 'Segoe UI', Arial, sans-serif" font-weight="400" font-size="11.5" fill="#8F877A" text-anchor="middle">14 oct. – 28 oct.</text><circle class="ring" cx="430" cy="86" r="56" fill="none" stroke="#C8AA6E" stroke-opacity=".45" stroke-width="5" stroke-dasharray="1.2 4.664"/><circle cx="430" cy="86" r="44" fill="#08080A" fill-opacity=".6" stroke="#C8AA6E" stroke-opacity=".2" stroke-width="4"/><circle class="arc" cx="430" cy="86" r="44" fill="none" stroke="#D3202C" stroke-width="4" stroke-linecap="round" pathLength="100" st